name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Jobs run on the self-hosted runner named by the CI_RUNNER repo variable
# (GitHub-hosted when it is unset). PRs from forks, or whose head repo is gone,
# go to GitHub-hosted runners. That routing is a convenience, not the security
# boundary: a fork PR can edit this file. Untrusted code is kept off the
# self-hosted runner by the repo setting that requires approval for all outside
# contributors' workflow runs, and the runner itself is sandboxed.
# PR runs cancel superseded runs; push and dispatch runs are keyed by commit, so
# none is dropped while the single runner is busy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-compatibility:
    name: Protocol Compatibility Check
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build protocol package
        run: npm run build -w packages/protocol

      - name: Run protocol consumer typecheck fixture
        run: npm run test:consumer-typecheck -w packages/protocol

      - name: Run protocol schema tests
        run: npm run test -w packages/protocol -- schemas.test

      - name: Run protocol cross-repo contract tests
        run: npm run test -w packages/protocol -- contract.cross-repo

      - name: Verify protocol compatibility in apps
        run: |
          echo "Verifying node-agent can consume protocol package..."
          # Pattern matches files containing 'protocol.contract' in path
          npm run test -w apps/node-agent -- protocol.contract

          echo "Verifying cnc can consume protocol package..."
          # Pattern matches files containing 'protocol.contract' in path
          npm run test -w apps/cnc -- protocol.contract

      - name: Run C&C schema-validation gate
        run: npm run test:schema-gate -w apps/cnc

  validate:
    name: Build, Lint, Typecheck, Test, Smoke
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: protocol-compatibility
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Node-agent dependency security gate
        run: npm run security:audit -w apps/node-agent

      - name: Run standard validation gate
        run: npm run validate:standard

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
          retention-days: 30
