name: Cross-Service E2E Smoke

on:
  # Manual only: ci.yml already runs this suite on every push and PR through
  # `npm run validate:standard`. Runs on the CI_RUNNER self-hosted runner.
  workflow_dispatch:

jobs:
  smoke:
    name: Node Agent <-> C&C Smoke
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cross-service smoke suite
        run: npm run test:e2e:smoke -w apps/cnc
